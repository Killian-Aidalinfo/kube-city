# Valeurs par défaut : pensées pour un Kapsule multi-zone. Chaque réglage HA est commenté.

image:
  repository: ghcr.io/killian-aidalinfo/kube-city
  tag: ""            # vide = appVersion du chart
  pullPolicy: IfNotPresent

# Au moins 3 pods : on peut en perdre un (panne) pendant qu'un autre est remplacé (mise à jour)
replicaCount: 3

# Mise à jour sans jamais descendre sous le nombre de pods voulu
strategy:
  maxUnavailable: 0
  maxSurge: 1

# Délai entre « je ne suis plus prêt » et la fermeture des WebSocket :
# le temps que le Service et l'Ingress retirent le pod
drainDelayMs: 5000
terminationGracePeriodSeconds: 30

# Une panne (ou un kubectl drain) ne peut pas emporter plus d'un pod à la fois
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Répartir les pods sur des nœuds ET des zones différents
topologySpread:
  enabled: true
  # Kapsule mono-zone : l'important est de répartir les pods sur des NŒUDS différents.
  node: DoNotSchedule        # passer à ScheduleAnyway si vous avez moins de nœuds que de pods
  zone: ScheduleAnyway       # utile seulement sur un cluster multi-zone

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  cpu: 70

# Mesuré (README, « Tenir la charge ») : ~110 Mo max et ~15 % d'un coeur par pod pour 60 joueurs.
# Pas de limite CPU : un throttling ajouterait de la latence aux snapshots ; la limite mémoire reste le garde-fou.
resources:
  requests: { cpu: 200m, memory: 160Mi }
  limits: { memory: 320Mi }

# Redis : tout l'état du jeu. C'est le point faible à traiter !
redis:
  # true = un Redis simple dans le cluster (pratique, mais c'est un SPOF : s'il tombe, le jeu tombe)
  # false = Redis externe en HA (ex. base Redis managée Scaleway) via redis.url ou redis.existingSecret
  enabled: true
  url: ""
  existingSecret: ""         # Secret contenant la clé REDIS_URL
  # Redis en HA avec Sentinel (ex. chart Bitnami redis avec sentinel.enabled=true) :
  # redis.enabled=false, puis la liste des Sentinel et le nom du maître surveillé
  sentinel:
    hosts: ""                # ex. "redis-node-0.redis-headless:26379,redis-node-1.redis-headless:26379,redis-node-2.redis-headless:26379"
    masterName: mymaster
    passwordSecret: ""       # Secret contenant la clé REDIS_PASSWORD (si Redis a un mot de passe)
  image: redis:7-alpine
  persistence:
    enabled: false
    size: 1Gi

# Jeton optionnel pour le serveur MCP (/mcp). Vide = ouvert.
mcp:
  token: ""

service:
  port: 80

ingress:
  enabled: true
  className: traefik         # nginx, traefik…
  host: jeu.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  tls: true

serviceMonitor:
  enabled: false             # true si kube-prometheus-stack est installé

podAnnotations: {}
nodeSelector: {}
tolerations: []
