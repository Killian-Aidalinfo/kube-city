{{- $ds := eq .Values.kind "DaemonSet" }}
apiVersion: apps/v1
kind: {{ $ds | ternary "DaemonSet" "Deployment" }}
metadata:
  name: {{ include "pn.name" . }}
  labels: {{- include "pn.labels" . | nindent 4 }}
spec:
  {{- if $ds }}
  # DaemonSet : un pod par nœud ; mise à jour nœud par nœud, le nouveau pod démarre avant l'arrêt de l'ancien
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- else }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values.strategy.maxSurge }}
  {{- end }}
  selector:
    matchLabels: {{- include "pn.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pn.selector" . | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{ end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- if and .Values.topologySpread.enabled (not $ds) }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.zone }}
          labelSelector:
            matchLabels: {{- include "pn.selector" . | nindent 14 }}
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.node }}
          # un nœud vidé (kubectl drain = cordon) ne compte plus : le pod chassé peut se replacer ailleurs
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels: {{- include "pn.selector" . | nindent 14 }}
          # ne compter que les pods de CE ReplicaSet : sinon, pendant un rollout, le nouveau se place
          # en fonction de l'ancien et deux pods peuvent finir sur le même nœud une fois l'ancien parti
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      containers:
        - name: game
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: DRAIN_DELAY_MS
              value: {{ .Values.drainDelayMs | quote }}
            {{- if .Values.redis.sentinel.hosts }}
            - name: REDIS_SENTINELS
              value: {{ .Values.redis.sentinel.hosts | quote }}
            - name: REDIS_SENTINEL_NAME
              value: {{ .Values.redis.sentinel.masterName | quote }}
            {{- if .Values.redis.sentinel.passwordSecret }}
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.redis.sentinel.passwordSecret }}, key: REDIS_PASSWORD } }
            {{- end }}
            {{- else if .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.redis.existingSecret }}, key: REDIS_URL } }
            {{- else }}
            - name: REDIS_URL
              value: {{ include "pn.redisUrl" . | quote }}
            {{- end }}
            {{- if .Values.mcp.token }}
            - name: MCP_TOKEN
              valueFrom: { secretKeyRef: { name: {{ include "pn.name" . }}-mcp, key: token } }
            {{- end }}
          # prêt = Redis joignable et pas en train de s'arrêter
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
