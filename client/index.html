<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" /><link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kube City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; color: #fff; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* couche pour l'interface (le module ui y ajoute ses éléments) */
    #ui-root { position: fixed; inset: 0; pointer-events: none; }
    #ui-root > * { pointer-events: auto; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b1020; z-index: 10; transition: opacity .4s; }
    #boot.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui-root"></div>
  <div id="boot">Chargement de Kube City…</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
